        </div>
        <div class="card scroll-x">
          <h2>계산대별 매출 <small style="font-size:14px;color:var(--muted)">(돈통 정산용 · 취소 제외)</small></h2>
          <table>
            <thead><tr><th>계산대</th><th>번호 구간</th><th class="num">주문 건수</th><th class="num">매출</th></tr></thead>
            <tbody>${R.byRegister.map((r) => `<tr><td>결제 ${r.register}</td><td>${rangeText(r.register)} …</td>
              <td class="num">${r.count}건</td><td class="num">${money(r.amount)}</td></tr>`).join('')}</tbody>
          </table>
        </div>
        <div class="card scroll-x">
          <h2>메뉴별 판매</h2>
          ${R.menuSales.length ? `<table>
            <thead><tr><th>메뉴</th><th class="num">판매 수량</th><th class="num">매출</th><th class="num">비중</th></tr></thead>
            <tbody>${R.menuSales.map((m) => `<tr><td>${esc(m.name)}</td><td class="num">${m.qty}</td><td class="num">${money(m.amount)}</td>
              <td class="num">${R.totalSales ? Math.round(m.amount / R.totalSales * 100) : 0}%</td></tr>`).join('')}</tbody>
          </table>` : '<div style="color:var(--muted)">판매 기록이 없습니다.</div>'}
        </div>
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
            <h2 style="margin:0">시간대별 매출</h2>
            <div class="tabs" style="margin:0">
              <button class="${this.bucketMin === 30 ? 'on' : ''}" onclick="Admin.bucketMin=30;Admin.render()">30분</button>
              <button class="${this.bucketMin === 60 ? 'on' : ''}" onclick="Admin.bucketMin=60;Admin.render()">1시간</button>
            </div>
          </div>
          ${R.buckets.length ? `<div class="bars">${R.buckets.map((b) => `
            <div class="bar" title="${timeStr(b.t)} · ${b.count}건 · ${money(b.amount)}">
              <span class="val">${b.amount ? Number(b.amount).toLocaleString('ko-KR') : ''}</span>
              <div class="fill" style="height:${(b.amount / max) * 100}%"></div>
              <span class="t">${timeStr(b.t)}</span>
            </div>`).join('')}</div>` : '<div style="color:var(--muted);margin-top:12px">판매 기록이 없습니다.</div>'}
        </div>
        <div class="card scroll-x">
          <h2>재고 대사표</h2>
          <div style="color:var(--muted);font-size:14px;margin-bottom:8px">이론상 잔여 = 초기 + 보충 − 판매 − 폐기·증정. 현재 재고와 다르면 빨간색으로 표시됩니다.</div>
          <table>
            <thead><tr><th>메뉴</th><th class="num">초기</th><th class="num">보충</th><th class="num">판매</th><th class="num">폐기·증정</th><th class="num">이론상 잔여</th><th class="num">현재 재고</th></tr></thead>
            <tbody>${R.recon.map((r) => `<tr style="${r.theory !== r.current ? 'background:#fff5f5;color:var(--danger)' : ''}">
              <td>${esc(r.name)}</td><td class="num">${r.initial}</td><td class="num">${r.restock}</td><td class="num">${r.sold}</td>
              <td class="num">${r.waste}</td><td class="num"><b>${r.theory}</b></td><td class="num">${r.current}</td></tr>`).join('')}</tbody>
          </table>
        </div>
        <div class="card scroll-x">
          <h2>취소 내역</h2>
          ${R.cancelled.length ? `<table>
            <thead><tr><th>번호</th><th>주문 시각</th><th>취소 시각</th><th>메뉴</th><th class="num">금액</th></tr></thead>
            <tbody>${R.cancelled.map((o) => `<tr><td>${o.orderNo}</td><td>${timeStr(o.createdAt)}</td><td>${timeStr(o.cancelledAt)}</td>
              <td>${esc(itemsText(o.items))}</td><td class="num">${money(o.total)}</td></tr>`).join('')}</tbody>
          </table>` : '<div style="color:var(--muted)">취소 내역이 없습니다.</div>'}
        </div>
      </div>`;
  },

  /* ---------------- 설정 탭 ---------------- */
  settingsHtml() {
    const st = S.settings;
    return `
      <div class="admin-grid">
        <div class="card">
          <h2>결제 화면</h2>
          <div class="row">
            <div class="field" style="flex:2"><label>빠른 입력 버튼 금액 (쉼표로 구분)</label>
              <input value="${esc((st.quickCash || []).join(', '))}" onchange="Admin.saveQuick(this.value)"></div>
            <div class="field" style="flex:1"><label>새 메뉴 기본 경고 기준 (개)</label>
              <input type="number" min="0" value="${st.threshold}" onchange="Admin.saveNum('threshold', this.value)"></div>
          </div>
        </div>
        <div class="card">
          <h2>조리대·매니저 화면</h2>
          <div class="row">
            <div class="field" style="max-width:260px"><label>조리 지연 강조 기준 (결제 후, 분)</label>
              <input type="number" min="1" value="${st.lateMinutes}" onchange="Admin.saveNum('lateMinutes', this.value)"></div>
            <div class="field" style="max-width:260px"><label>미수령 강조 기준 (조리 완료 후, 분)</label>
              <input type="number" min="1" value="${st.pickupLateMinutes}" onchange="Admin.saveNum('pickupLateMinutes', this.value)"></div>
          </div>
        </div>
        <div class="card">
          <h2>호출 화면 소리</h2>
          <div class="row" style="align-items:center">
            <div class="field" style="flex:1;min-width:200px"><label>음성 속도: <b id="rateVal">${Number(st.ttsRate).toFixed(1)}</b></label>
              <input type="range" min="0.5" max="2" step="0.1" value="${st.ttsRate}" oninput="$('#rateVal').textContent=Number(this.value).toFixed(1)" onchange="Admin.saveNum('ttsRate', this.value)"></div>
            <div class="field" style="flex:1;min-width:200px"><label>볼륨: <b id="volVal">${Math.round(st.ttsVolume * 100)}%</b></label>
              <input type="range" min="0" max="1" step="0.05" value="${st.ttsVolume}" oninput="$('#volVal').textContent=Math.round(this.value*100)+'%'" onchange="Admin.saveNum('ttsVolume', this.value)"></div>
            <label style="font-size:18px;font-weight:700;display:flex;gap:8px;align-items:center">
              <input type="checkbox" style="width:26px;height:26px" ${st.chime !== false ? 'checked' : ''} onchange="DB.saveSettings({chime:this.checked})"> 차임음 사용</label>
            <button class="btn" onclick="Sound.unlock();Sound.announce(7)">🔊 이 기기에서 호출 테스트</button>
          </div>
          <div style="color:var(--muted);font-size:14px;margin-top:8px">설정은 모든 기기에 공유됩니다. 호출 화면 기기의 시스템 볼륨도 확인하세요.</div>
        </div>
        <div class="card">
          <h2>이 기기</h2>
          <div style="margin-bottom:12px">데이터 모드: <b>${DB.mode === 'firebase' ? 'Firebase 실시간 동기화' : '로컬 모드 (이 기기 안에서만 저장 · 연습용)'}</b>
            ${DB.path ? `<br>저장 위치: <code>${esc(DB.path)}</code>` : ''}</div>
          <button class="btn" onclick="changeRole()">기기 역할 다시 선택</button>
        </div>
        <div class="card" style="border-color:#ffc9c9">
          <h2 style="color:var(--danger)">데이터 초기화</h2>
          <div style="margin-bottom:12px">리허설 후 실제 운영 전에 사용하세요. <b>모든 주문·취소·보충·폐기 기록과 주문번호가 삭제</b>되고,
            재고는 초기 수량으로 되돌아갑니다. (메뉴와 설정은 유지)</div>
          <button class="btn danger" onclick="Admin.reset()">데이터 초기화…</button>
        </div>
      </div>`;
  },

  async saveNum(key, value) {
    const v = Number(value);
    if (!(v >= 0)) { toast('숫자를 확인하세요'); return; }
    await run(() => DB.saveSettings({ [key]: v }), '저장했습니다');
  },

  async saveQuick(value) {
    const list = value.split(/[,\s]+/).map(Number).filter((n) => n > 0).slice(0, 3);
    if (!list.length) { toast('금액을 1개 이상 입력하세요'); this.render(); return; }
    await run(() => DB.saveSettings({ quickCash: list }), '저장했습니다 (최대 3개)');
  },

  // 확인 2단계: 1) 경고 확인 → 2) '초기화' 직접 입력
  async reset() {
    const ok1 = await confirmModal({
      title: '⚠️ 데이터 초기화 (1/2)', okText: '다음', okClass: 'danger',
      msg: `이 앱(${esc(DB.path || '로컬')})의 주문 ${S.orders.length}건, 재고 조정 ${S.adjustments.length}건이 모두 삭제됩니다.
(같은 Firebase 프로젝트의 다른 앱 데이터는 건드리지 않습니다.)\n되돌릴 수 없습니다. 필요하면 먼저 정산 탭에서 CSV를 내려받으세요.`,
    });
    if (!ok1) return;
    const ok2 = await new Promise((resolve) => {
      const m = openModal(`
        <h2>⚠️ 데이터 초기화 (2/2)</h2>
        <div class="msg">계속하려면 아래 칸에 <b>초기화</b> 라고 입력하세요.</div>
        <div class="field"><input id="resetConfirm" autocomplete="off"></div>
        <div class="actions"><button class="btn ghost" data-r="0">취소</button><button class="btn danger" data-r="1">초기화 실행</button></div>`);
      m.querySelectorAll('[data-r]').forEach((b) => b.onclick = () => {
        const v = m.querySelector('#resetConfirm').value.trim();
        if (b.dataset.r === '1' && v !== '초기화') { toast("'초기화'를 정확히 입력하세요"); return; }
        m.remove(); resolve(b.dataset.r === '1');
      });
    });
    if (ok2) await run(() => DB.resetAll(), '데이터를 초기화했습니다');
  },
};
VIEWS.admin = Admin;

document.addEventListener('focusout', () => {
  setTimeout(() => {
    const a = document.activeElement;
    if (Admin.dirty && role === 'admin' && !(a && /INPUT|SELECT|TEXTAREA/.test(a.tagName))) {
      Admin.dirty = false; Admin.render();
    }
  }, 50);
});

/* =====================================================================
   시작
   ===================================================================== */
(async function init() {
  renderApp();
  const fb = CONFIG.firebase;
  try {
    DB = fb.apiKey && fb.projectId ? await createFirestoreBackend() : createLocalBackend();
  } catch (e) {
    console.error(e);
    $('#app').innerHTML = `<div class="empty">Firebase 연결에 실패했습니다.<br><small>${esc(e.message)}</small><br><br>
      <button class="btn primary" onclick="location.reload()">다시 시도</button></div>`;
    return;
  }
  setNetState('on');
  DB.start();
  renderApp();
})();
</script>
</body>
</html>
