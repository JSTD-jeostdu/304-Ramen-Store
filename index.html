<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>슈의 라면 가게 POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff8ef;
    --panel: #ffffff;
    --ink: #1d1a17;
    --muted: #6b635b;
    --line: #e4d9cc;
    --brand: #d9480f;
    --brand-dark: #a8380b;
    --ok: #2b8a3e;
    --warn: #f08c00;
    --danger: #c92a2a;
    --info: #1864ab;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
    user-select: none; -webkit-user-select: none;
  }
  input, textarea, select { user-select: text; -webkit-user-select: text; font: inherit; }
  button { font: inherit; cursor: pointer; border: none; touch-action: manipulation; }
  button:disabled { cursor: not-allowed; opacity: .4; }

  /* ---------- 상단 바 ---------- */
  .topbar {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--ink); color: #fff; flex-wrap: wrap;
  }
  .topbar h1 { font-size: 20px; margin: 0; font-weight: 900; }
  .topbar .role-tag { background: var(--brand); padding: 4px 12px; border-radius: 999px; font-weight: 700; }
  .topbar .spacer { flex: 1; }
  .topbar .net { font-size: 14px; padding: 4px 10px; border-radius: 999px; background: #2b8a3e; }
  .topbar .net.off { background: var(--danger); }
  .topbar .net.local { background: #5f3dc4; }
  .topbar button { background: #444; color: #fff; padding: 8px 14px; border-radius: 10px; font-weight: 700; }

  main { flex: 1; padding: 16px; min-height: 0; }
  footer { text-align: center; padding: 8px; color: var(--muted); font-size: 13px; }

  .btn { padding: 14px 20px; border-radius: 12px; font-weight: 700; font-size: 18px; background: #e9e2d8; color: var(--ink); }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.ok { background: var(--ok); color: #fff; }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn.ghost { background: transparent; border: 2px solid var(--line); }
  .btn.small { padding: 8px 12px; font-size: 15px; }

  .card { background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius); padding: 16px; }
  h2 { margin: 0 0 12px; font-size: 22px; }
  h3 { margin: 16px 0 8px; font-size: 18px; }

  /* ---------- 역할 선택 ---------- */
  .role-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; max-width: 1000px; margin: 40px auto; }
  .role-grid button { min-height: 180px; border-radius: 20px; background: var(--panel); border: 3px solid var(--line); font-size: 26px; font-weight: 900; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .role-grid button span { font-size: 56px; }
  .role-grid button small { font-size: 15px; font-weight: 400; color: var(--muted); }
  .role-grid button:active { border-color: var(--brand); transform: scale(.98); }

  /* ---------- 결제 화면 ---------- */
  .order-layout { display: grid; grid-template-columns: 1fr 660px; gap: 16px; align-items: start; }
  .side { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .side .col { display: flex; flex-direction: column; gap: 12px; }
  @media (max-width: 1150px) { .order-layout { grid-template-columns: 1fr; } }
  @media (max-width: 640px) { .side { grid-template-columns: 1fr; } }
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; align-content: start; }
  .tile {
    position: relative; min-height: 140px; min-width: 120px; border-radius: 18px;
    background: var(--panel); border: 3px solid var(--line); padding: 12px;
    display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
  }
  .tile:active:not(:disabled) { transform: scale(.96); border-color: var(--brand); }
  .tile .name { font-size: 22px; font-weight: 900; line-height: 1.2; }
  .tile .price { font-size: 18px; color: var(--muted); margin-top: 6px; }
  .tile .stock { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .tile .qty-badge { position: absolute; top: -10px; right: -10px; background: var(--brand); color: #fff; min-width: 40px; height: 40px; border-radius: 20px; font-size: 22px; font-weight: 900; display: flex; align-items: center; justify-content: center; padding: 0 8px; }
  .tile .low-badge { position: absolute; top: 8px; left: 8px; background: var(--warn); color: #fff; font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 8px; }
  .tile.soldout { opacity: 1; background: #eee; }
  .tile.soldout::after { content: 'SOLD OUT'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.55); color: #fff; font-size: 24px; font-weight: 900; border-radius: 15px; letter-spacing: 1px; }

  .cart-list { max-height: 200px; overflow: auto; }
  .cart-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 18px; }
  .cart-row .n { flex: 1; font-weight: 700; }
  .cart-row .del { background: #ffe3e3; color: var(--danger); width: 44px; height: 44px; border-radius: 10px; font-size: 20px; font-weight: 900; }
  .total-line { display: flex; justify-content: space-between; align-items: baseline; font-size: 20px; font-weight: 700; margin-top: 8px; }
  .total-line .big { font-size: 38px; font-weight: 900; color: var(--brand); }
  .received { font-size: 30px; font-weight: 900; text-align: right; }
  .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0; }
  .quick button { padding: 14px 4px; border-radius: 10px; background: #fff0e0; font-weight: 700; font-size: 17px; border: 2px solid #ffd8a8; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .keypad button { height: 58px; border-radius: 12px; background: #f1ebe3; font-size: 26px; font-weight: 700; }
  .keypad button:active { background: #e0d6ca; }
  .change-box { text-align: center; padding: 14px; border-radius: 14px; background: #ebfbee; border: 3px solid var(--ok); }
  .change-box .label { font-size: 18px; font-weight: 700; }
  .change-box .amt { font-size: 56px; font-weight: 900; color: var(--ok); line-height: 1.1; }
  .change-box.short { background: #fff5f5; border-color: var(--danger); }
  .change-box.short .amt { color: var(--danger); font-size: 32px; }
  .pay-btn { width: 100%; padding: 22px; font-size: 28px; font-weight: 900; border-radius: 16px; background: var(--ok); color: #fff; }

  .recent-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .recent-row .no { font-size: 24px; font-weight: 900; width: 60px; }
  .recent-row .desc { flex: 1; font-size: 15px; }
  .status { font-size: 13px; font-weight: 700; padding: 3px 8px; border-radius: 8px; color: #fff; }
  .status.waiting { background: var(--warn); }
  .status.ready { background: var(--ok); }
  .status.cancelled { background: #868e96; }
  .status.picked { background: var(--info); }
  .memo { background: #fff3bf; color: #5c3c00; border-radius: 8px; padding: 4px 8px; font-size: 15px; font-weight: 700; margin: 4px 0; }
  .btn.blue { background: var(--info); color: #fff; }

  /* ---------- 조리대 ---------- */
  .kitchen-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .k-card { background: var(--panel); border: 3px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .k-card.late { border-color: var(--danger); background: #fff5f5; animation: pulse 1.5s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(201,42,42,.25); } }
  .k-card .head { display: flex; justify-content: space-between; align-items: center; }
  .k-card .no { font-size: 56px; font-weight: 900; line-height: 1; }
  .k-card .elapsed { font-size: 20px; font-weight: 700; color: var(--muted); }
  .k-card.late .elapsed { color: var(--danger); }
  .k-card ul { margin: 0; padding: 0; list-style: none; font-size: 22px; font-weight: 700; }
  .k-card li { padding: 4px 0; display: flex; justify-content: space-between; }
  .k-card .ready-btn { padding: 20px; font-size: 24px; font-weight: 900; border-radius: 14px; background: var(--ok); color: #fff; }
  .empty { text-align: center; color: var(--muted); font-size: 24px; padding: 60px 0; }
  .empty.small { font-size: 18px; padding: 20px 0; }
  .k-section { margin: 28px 0 12px; font-size: 22px; }
  .k-section small { font-size: 15px; color: var(--muted); font-weight: 400; }
  .k-card.pickup .no { font-size: 40px; }
  .k-card.pickup ul { font-size: 18px; }
  .k-card .ready-btn.pick { background: var(--info); }
  .summary-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .summary-bar .chip { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 8px 14px; font-size: 18px; font-weight: 700; }

  /* ---------- 호출 화면 ---------- */
  body.display-mode { background: #111; color: #fff; }
  body.display-mode .topbar, body.display-mode footer.app-foot { display: none; }
  body.display-mode main { padding: 0; overflow: hidden; }
  .display { height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 3vh 3vw; }
  .display .title { font-size: 6vh; font-weight: 900; color: #ffd43b; text-align: center; }
  .display .label { font-size: 3.5vh; margin-top: 2vh; color: #ccc; }
  .display .current { font-size: 24vh; font-weight: 900; line-height: 1; color: #fff; margin: 1vh 0; }
  .display .current.flash { animation: flash 0.6s ease-in-out 5; }
  @keyframes flash { 0%,100% { transform: scale(1); color: #fff; } 50% { transform: scale(1.18); color: #ff922b; } }
  .display .msg { font-size: 4.5vh; font-weight: 700; }
  /* 하단 현황판: 조리 중 / 조리 완료 */
  .display .boards { margin-top: auto; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 2vw; }
  .display .board { background: #1c1c1c; border: 2px solid #333; border-radius: 2vh; padding: 1.5vh 1.5vw; height: 29vh; overflow: hidden; }
  .display .board h3 { margin: 0 0 1vh; font-size: 3vh; display: flex; justify-content: space-between; align-items: baseline; }
  .display .board h3 small { font-size: 2.2vh; color: #888; font-weight: 400; }
  .display .board.cooking h3 { color: #ffa94d; }
  .display .board.done h3 { color: #69db7c; }
  .display .chips { display: flex; flex-wrap: wrap; gap: 0.9vh 0.6vw; align-content: flex-start; }
  .display .chip { font-size: 3.6vh; font-weight: 900; min-width: 6.4vw; text-align: center; padding: 0.4vh 0.6vw; border-radius: 1.2vh; background: #2b2b2b; color: #ddd; }
  .display .cooking .chip { border: 2px solid #7a4a17; }
  .display .done .chip { border: 2px solid #2b6b36; color: #b2f2bb; }
  .display .done .chip.now { background: #2b8a3e; color: #fff; }
  .display .chip.more { font-size: 2.6vh; color: #888; border-style: dashed; }
  .display .board .none { color: #666; font-size: 2.6vh; }
  .display .foot { margin-top: 1.5vh; font-size: 2vh; color: #666; }
  .start-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.9); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 36px; font-weight: 900; z-index: 50; text-align: center; gap: 16px; }
  .start-overlay small { font-size: 18px; font-weight: 400; color: #bbb; }
  .display-exit { position: fixed; right: 8px; bottom: 8px; background: transparent; color: #333; font-size: 14px; padding: 6px; }

  /* ---------- 관리자 ---------- */
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tabs button { padding: 12px 20px; border-radius: 12px; background: #e9e2d8; font-weight: 700; font-size: 18px; }
  .tabs button.on { background: var(--ink); color: #fff; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; font-size: 16px; }
  th { background: #f6efe6; font-weight: 700; }
  td.num, th.num { text-align: right; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 14px; color: var(--muted); font-weight: 700; }
  .field input, .field select { padding: 10px; border: 2px solid var(--line); border-radius: 10px; font-size: 17px; min-width: 0; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .admin-grid { display: grid; gap: 16px; }
  .menu-edit td input { width: 100%; padding: 8px; border: 2px solid var(--line); border-radius: 8px; font-size: 16px; }
  .menu-edit td input.n { max-width: 110px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .stat { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 14px; }
  .stat .k { color: var(--muted); font-weight: 700; font-size: 15px; }
  .stat .v { font-size: 32px; font-weight: 900; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 220px; padding-top: 24px; overflow-x: auto; }
  .bar { flex: 1; min-width: 36px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bar .fill { width: 100%; background: var(--brand); border-radius: 6px 6px 0 0; min-height: 2px; position: relative; }
  .bar .val { font-size: 11px; color: var(--ink); margin-bottom: 2px; white-space: nowrap; }
  .bar .t { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap; }
  .scroll-x { overflow-x: auto; }

  /* ---------- 매니저 ---------- */
  .mgr-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; }
  .mgr-count { background: var(--panel); border: 3px solid var(--line); border-radius: 14px; padding: 8px 14px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 17px; }
  .mgr-count b { font-size: 32px; font-weight: 900; }
  .mgr-count.waiting { border-color: #ffc078; }
  .mgr-count.ready { border-color: #74c0fc; }
  .mgr-count.picked { border-color: #8ce99a; }
  .mgr-count.cancelled { border-color: #ced4da; color: var(--muted); }
  .mgr-alerts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .alert { padding: 8px 12px; border-radius: 10px; font-weight: 700; font-size: 15px; }
  .alert.red { background: #ffe3e3; color: var(--danger); }
  .alert.amber { background: #fff3bf; color: #8f5d00; }
  .alert.gray { background: #e9ecef; color: #495057; }
  .alert.ok { background: #ebfbee; color: var(--ok); }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { padding: 10px 14px; border-radius: 10px; background: #e9e2d8; font-weight: 700; font-size: 15px; }
  .seg button.on { background: var(--ink); color: #fff; }
  .mgr-controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; align-items: center; }
  .mgr-controls input { padding: 12px; border: 2px solid var(--line); border-radius: 10px; font-size: 17px; flex: 1; min-width: 220px; }
  .mgr-colpick { display: none; margin-bottom: 12px; }
  .mgr-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: start; }
  .mgr-col { background: #f3ebe0; border-radius: 16px; padding: 10px; min-height: 160px; }
  .mgr-col h3 { margin: 4px 4px 10px; display: flex; justify-content: space-between; font-size: 19px; }
  .mgr-col .none { color: var(--muted); text-align: center; padding: 16px 0; font-size: 15px; }
  .m-card { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; cursor: pointer; }
  .m-card:active { border-color: var(--brand); }
  .m-card.late { border-color: var(--danger); background: #fff5f5; }
  .m-head { display: flex; align-items: baseline; gap: 8px; }
  .m-no { font-size: 30px; font-weight: 900; line-height: 1; }
  .m-reg { font-size: 13px; color: var(--muted); background: #f1ebe3; border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
  .m-head .m-time { margin-left: auto; }
  .m-time { font-size: 14px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .late .m-time { color: var(--danger); }
  .m-items { font-size: 17px; font-weight: 700; margin: 6px 0; line-height: 1.4; }
  .m-actions { display: flex; gap: 6px; margin-top: 6px; }
  .m-actions .btn { flex: 1; padding: 12px 6px; font-size: 16px; }
  .mgr-table tbody tr { cursor: pointer; }
  .mgr-table tbody tr.late td { background: #fff5f5; }
  .modal.wide { width: min(640px, 100%); }
  .d-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .d-no { font-size: 42px; font-weight: 900; }
  .timeline { list-style: none; padding: 0; margin: 0; font-size: 17px; }
  .timeline li { padding: 7px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .timeline li b { margin-left: auto; }
  .timeline li small { width: 100%; color: var(--muted); }
  .d-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .d-actions .btn { padding: 14px 8px; font-size: 17px; }
  @media (max-width: 760px) {
    .mgr-summary { grid-template-columns: repeat(2, 1fr); }
    .mgr-colpick { display: block; }
    .mgr-board { grid-template-columns: 1fr; }
    .mgr-board .mgr-col { display: none; }
    .mgr-board[data-col="waiting"] .mgr-col.waiting,
    .mgr-board[data-col="ready"] .mgr-col.ready,
    .mgr-board[data-col="picked"] .mgr-col.picked { display: block; }
    .mgr-table .hide-sm { display: none; }
    .d-actions { grid-template-columns: 1fr; }
  }

  /* ---------- 모달 / 토스트 ---------- */
  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal { background: #fff; color: var(--ink); border-radius: 20px; padding: 24px; width: min(460px, 100%); max-height: 90vh; overflow: auto; }
  .modal h2 { font-size: 24px; }
  .modal .msg { font-size: 19px; margin-bottom: 16px; white-space: pre-line; }
  .modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .modal .actions .btn { flex: 1; padding: 18px; font-size: 20px; }
  .modal .qty-display { font-size: 48px; font-weight: 900; text-align: center; padding: 8px; border: 2px solid var(--line); border-radius: 12px; margin-bottom: 12px; }
  .done-no { font-size: 140px; font-weight: 900; text-align: center; color: var(--brand); line-height: 1; margin: 10px 0; }
  .toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 14px 20px; border-radius: 14px; font-size: 18px; font-weight: 700; display: flex; gap: 14px; align-items: center; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .toast button { background: #ffd43b; color: var(--ink); padding: 10px 16px; border-radius: 10px; font-weight: 900; font-size: 18px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header class="topbar" id="topbar">
  <h1>🍜 슈의 라면 가게</h1>
  <span class="role-tag" id="roleTag"></span>
  <span class="spacer"></span>
  <span class="net" id="netTag">연결됨</span>
  <button onclick="changeRole()">역할 변경</button>
</header>
<main id="app"></main>
<footer class="app-foot">Made by 정우쌤</footer>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* =====================================================================
   CONFIG — Firebase 키·상수·기본값을 여기에 모아 둔다
   firebase.apiKey 가 비어 있으면 "로컬 모드"로 동작한다.
   (로컬 모드: 한 기기 안의 여러 탭끼리만 동기화 → 리허설·연습용)

   ※ 기존 Firebase 프로젝트를 함께 쓰는 경우
     - 이 앱의 모든 데이터는 dataRoot/eventId 문서 아래에만 저장된다.
       (예: ramen304_pos/festival-2026/orders/...)
       → 다른 앱의 컬렉션을 읽거나 덮어쓰거나 초기화하지 않는다.
     - appName 으로 Firebase 인스턴스와 오프라인 캐시(IndexedDB)를 분리한다.
       → 같은 도메인(예: ○○.github.io)의 다른 앱과 캐시가 섞이지 않는다.
   ===================================================================== */
const CONFIG = {
  // Firebase 콘솔 > 프로젝트 설정 > 내 앱 > (새로 추가한 웹 앱) 의 설정값을 붙여넣는다

// 계산대 번호(1부터)와 그 계산대의 n번째 주문 → 주문번호
function orderNoFor(register, seq) {
  const B = CONFIG.orderBlockSize, K = CONFIG.cashierCount, idx = seq - 1;
  return Math.floor(idx / B) * K * B + (register - 1) * B + (idx % B) + 1;
}

/* =====================================================================

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => `${Number(n || 0).toLocaleString('ko-KR')}${CONFIG.currencyUnit}`;
const pad2 = (n) => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const timeStr = (ms) => { if (!ms) return ''; const d = new Date(ms); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const dateTimeStr = (ms) => { if (!ms) return ''; const d = new Date(ms); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; };

/* =====================================================================

const S = {

  orders: [],       // createdAt 순 정렬
  adjustments: [],
  settings: { ...CONFIG.defaults },
  ready: { menus: false, orders: false, adjustments: false, settings: false },
};

function setCollection(name, list) {
  if (name === 'settings') {
    S.settings = { ...CONFIG.defaults, ...(list || {}) };
  } else {
    const sortKey = name === 'menus' ? 'order' : 'createdAt';
    S[name] = list.sort((a, b) => (a[sortKey] ?? 0) - (b[sortKey] ?? 0));
  }
  S.ready[name] = true;
  onDataChange(name);
}

/* =====================================================================
   데이터 계층 1) Firestore 백엔드
   - 필드 단위 update / increment 로 last-write-wins 유실 방지
   - 주문번호 발번·재고 확인은 트랜잭션
   ===================================================================== */
async function createFirestoreBackend() {
  const v = CONFIG.firebaseVersion;
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`);
  const F = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore.js`);
  if (!/^[A-Za-z0-9_-]+$/.test(CONFIG.dataRoot || '') || !/^[A-Za-z0-9_-]+$/.test(CONFIG.eventId || '')) {
    throw new Error('CONFIG.dataRoot / eventId 는 영문·숫자·_·- 로만 입력하세요.');
  }
  // 이름 있는 인스턴스로 초기화 → 기본([DEFAULT]) 인스턴스를 쓰는 다른 앱과 분리
  const app = initializeApp(CONFIG.firebase, CONFIG.appName);
  const dbId = CONFIG.databaseId || '(default)';

  // 오프라인 지속성: 네트워크가 끊겨도 캐시로 화면 유지, 복구 시 자동 동기화
  let db;
  try {
    db = F.initializeFirestore(app, {
      localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }),
    }, dbId);
  } catch (e) {
    console.warn('오프라인 캐시 사용 불가, 기본 모드로 동작', e);
    db = F.getFirestore(app, dbId);
  }

  // 모든 경로는 dataRoot/eventId 아래로 한정 (다른 앱 데이터에 절대 접근하지 않음)
  const base = [CONFIG.dataRoot, CONFIG.eventId];
  const col = (n) => F.collection(db, ...base, n);
  const ref = (n, id) => F.doc(db, ...base, n, id);

  return {
    mode: 'firebase',
    path: `${CONFIG.firebase.projectId} / ${dbId} / ${base.join('/')}`,

    start() {
      for (const name of ['menus', 'orders', 'adjustments']) {
        F.onSnapshot(col(name), { includeMetadataChanges: true }, (snap) => {
          setCollection(name, snap.docs.map((d) => ({ id: d.id, ...d.data() })));
          setNetState(snap.metadata.fromCache && !navigator.onLine ? 'off' : 'on');
        }, (err) => { console.error(err); toast(`DB 오류: ${err.message}`); });
      }
      F.onSnapshot(ref('settings', 'app'), (snap) => setCollection('settings', snap.exists() ? snap.data() : {}));
    },

    // 결제 확정: 재고 확인 + 주문번호 발번 + 재고 차감 + 주문 생성 을 한 트랜잭션으로
    async createOrder(items, received, register) {
      const orderRef = F.doc(col('orders'));
      return F.runTransaction(db, async (tx) => {
        const cRef = ref('counters', `register${register}`);   // 계산대마다 따로 센다
        const menuRefs = items.map((i) => ref('menus', i.menuId));
        const cSnap = await tx.get(cRef);
        const mSnaps = [];
        for (const r of menuRefs) mSnaps.push(await tx.get(r));

        mSnaps.forEach((s, i) => {
          if (!s.exists()) throw new Error(`'${items[i].name}' 메뉴가 삭제되었습니다.`);
          const cur = s.data().stockCurrent ?? 0;
          if (cur < items[i].qty) throw new Error(`'${items[i].name}' 재고 부족 (남은 수량 ${cur}개)`);
        });

        const today = todayStr();
        const c = cSnap.exists() ? cSnap.data() : null;
        const seq = c && c.date === today ? c.value + 1 : 1;   // 날짜가 바뀌면 처음 구간부터
        const orderNo = orderNoFor(register, seq);

        const total = items.reduce((s, i) => s + i.price * i.qty, 0);
        tx.set(cRef, { value: seq, date: today });
        menuRefs.forEach((r, i) => tx.update(r, { stockCurrent: F.increment(-items[i].qty) }));
        tx.set(orderRef, {
          orderNo, register, items, total, received, change: received - total,
          status: 'waiting', createdAt: Date.now(), readyAt: null, cancelledAt: null,
        });
        return orderNo;
      });
    },

    // 주문 취소: 상태 변경 + 재고 복구 (트랜잭션으로 중복 취소 방지)
    async cancelOrder(orderId) {
      await F.runTransaction(db, async (tx) => {
        const oRef = ref('orders', orderId);
        const oSnap = await tx.get(oRef);
        if (!oSnap.exists()) throw new Error('주문을 찾을 수 없습니다.');
        const o = oSnap.data();
        if (o.status === 'cancelled') throw new Error('이미 취소된 주문입니다.');
        const menuRefs = o.items.map((i) => ref('menus', i.menuId));
        const mSnaps = [];
        for (const r of menuRefs) mSnaps.push(await tx.get(r));
        tx.update(oRef, { status: 'cancelled', cancelledAt: Date.now() });
        mSnaps.forEach((s, i) => { if (s.exists()) tx.update(menuRefs[i], { stockCurrent: F.increment(o.items[i].qty) }); });
      });
    },

    // 주문 상태·메모 변경: 현재 상태가 from 목록에 있을 때만 반영
    // (다른 기기에서 방금 취소·수령 처리한 주문을 덮어쓰지 않도록 트랜잭션으로 확인)
    async updateOrder(orderId, fields, from) {
      await F.runTransaction(db, async (tx) => {
        const oRef = ref('orders', orderId);
        const snap = await tx.get(oRef);
        if (!snap.exists()) throw new Error('주문을 찾을 수 없습니다.');
        if (from && !from.includes(snap.data().status)) throw new Error('다른 기기에서 이미 상태가 바뀌었습니다. 화면을 확인해 주세요.');
        tx.update(oRef, fields);
      });
    },

    async addMenu(data) {
      await F.addDoc(col('menus'), data);
    },
    async updateMenu(id, fields) {
      await F.updateDoc(ref('menus', id), fields);
    },
    // 초기 수량 변경: 차이만큼 초기값·현재값을 함께 원자적으로 증감
    async changeStockInitial(id, delta) {
      await F.updateDoc(ref('menus', id), { stockInitial: F.increment(delta), stockCurrent: F.increment(delta) });
    },
    async deleteMenu(id) {
      await F.deleteDoc(ref('menus', id));
    },

    // 보충(+) / 폐기·증정(-) — 재고만 변경, 매출 미반영
    async adjust(menuId, type, qty, memo) {
      const batch = F.writeBatch(db);
      batch.set(F.doc(col('adjustments')), { menuId, type, qty, memo: memo || '', createdAt: Date.now() });
      batch.update(ref('menus', menuId), { stockCurrent: F.increment(type === 'restock' ? qty : -qty) });
      await batch.commit();
    },

    async saveSettings(fields) {
      await F.setDoc(ref('settings', 'app'), fields, { merge: true });
    },

    // 데이터 초기화: 주문·조정 이력·주문번호 삭제, 재고는 초기값으로 되돌림 (메뉴는 유지)
    async resetAll() {
      const docs = [];
      for (const name of ['orders', 'adjustments', 'counters']) {
        const snap = await F.getDocs(col(name));
        snap.forEach((d) => docs.push(d.ref));
      }
      const menus = await F.getDocs(col('menus'));
      const ops = [
        ...docs.map((r) => (b) => b.delete(r)),
        ...menus.docs.map((d) => (b) => b.update(d.ref, { stockCurrent: d.data().stockInitial ?? 0 })),
      ];
      for (let i = 0; i < ops.length; i += 400) {
        const b = F.writeBatch(db);
        ops.slice(i, i + 400).forEach((op) => op(b));
        await b.commit();
      }
    },
  };
}

/* =====================================================================
   데이터 계층 2) 로컬 백엔드 (Firebase 설정 전 연습용)
   - localStorage 에 저장, 같은 기기의 다른 탭과 storage 이벤트로 동기화
   ===================================================================== */
function createLocalBackend() {
  const KEY = CONFIG.localStorageKey;
  const load = () => {
    try {
      return JSON.parse(localStorage.getItem(KEY)) || null;
    } catch { return null; }
  };
  const blank = () => ({ menus: {}, orders: {}, adjustments: {}, settings: {}, counter: null });
  let mem = load() || blank();   // localStorage 사용 불가 환경 대비 메모리 사본

  const publish = () => {
    setCollection('menus', Object.entries(mem.menus).map(([id, d]) => ({ id, ...d })));
    setCollection('orders', Object.entries(mem.orders).map(([id, d]) => ({ id, ...d })));
    setCollection('adjustments', Object.entries(mem.adjustments).map(([id, d]) => ({ id, ...d })));
    setCollection('settings', mem.settings);
  };
  // 모든 변경은 최신 저장본을 읽고 → 수정 → 저장 (탭 간 덮어쓰기 최소화)
  const mutate = (fn) => {
    mem = load() || mem;
    const result = fn(mem);
    try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { console.warn(e); }
    publish();
    return result;
  };

  return {
    mode: 'local',
    start() {
      window.addEventListener('storage', (e) => { if (e.key === KEY) { mem = load() || blank(); publish(); } });
      publish();
    },
    async createOrder(items, received, register) {
      return mutate((db) => {
        items.forEach((i) => {
          const m = db.menus[i.menuId];
          if (!m) throw new Error(`'${i.name}' 메뉴가 삭제되었습니다.`);
          if (m.stockCurrent < i.qty) throw new Error(`'${i.name}' 재고 부족 (남은 수량 ${m.stockCurrent}개)`);
        });
        const today = todayStr();
        db.counters = db.counters || {};
        const c = db.counters[register];
        const seq = c && c.date === today ? c.value + 1 : 1;
        db.counters[register] = { value: seq, date: today };
        const orderNo = orderNoFor(register, seq);
        items.forEach((i) => { db.menus[i.menuId].stockCurrent -= i.qty; });
        const total = items.reduce((s, i) => s + i.price * i.qty, 0);
        db.orders[uid()] = {
          orderNo, register, items, total, received, change: received - total,
          status: 'waiting', createdAt: Date.now(), readyAt: null, cancelledAt: null,
        };
        return orderNo;
      });
    },
    async cancelOrder(orderId) {
      mutate((db) => {
        const o = db.orders[orderId];
        if (!o) throw new Error('주문을 찾을 수 없습니다.');
        if (o.status === 'cancelled') throw new Error('이미 취소된 주문입니다.');
        o.status = 'cancelled'; o.cancelledAt = Date.now();
        o.items.forEach((i) => { if (db.menus[i.menuId]) db.menus[i.menuId].stockCurrent += i.qty; });
      });
    },
    async updateOrder(orderId, fields, from) {
      mutate((db) => {
        const o = db.orders[orderId];
        if (!o) throw new Error('주문을 찾을 수 없습니다.');
        if (from && !from.includes(o.status)) throw new Error('다른 기기에서 이미 상태가 바뀌었습니다. 화면을 확인해 주세요.');
        Object.assign(o, fields);
      });
    },
    async addMenu(data) { mutate((db) => { db.menus[uid()] = data; }); },
    async updateMenu(id, fields) { mutate((db) => { if (db.menus[id]) Object.assign(db.menus[id], fields); }); },
    async changeStockInitial(id, delta) {
      mutate((db) => { const m = db.menus[id]; if (m) { m.stockInitial += delta; m.stockCurrent += delta; } });
    },
    async deleteMenu(id) { mutate((db) => { delete db.menus[id]; }); },
    async adjust(menuId, type, qty, memo) {
      mutate((db) => {
        db.adjustments[uid()] = { menuId, type, qty, memo: memo || '', createdAt: Date.now() };
        if (db.menus[menuId]) db.menus[menuId].stockCurrent += type === 'restock' ? qty : -qty;
      });
    },
    async saveSettings(fields) { mutate((db) => { Object.assign(db.settings, fields); }); },
    async resetAll() {
      mutate((db) => {
        db.orders = {}; db.adjustments = {}; db.counters = {};
        Object.values(db.menus).forEach((m) => { m.stockCurrent = m.stockInitial; });
      });
    },
  };
}

let DB = null;

function setNetState(state) {
  const tag = $('#netTag');
  if (!DB) return;
  if (DB.mode === 'local') { tag.textContent = '로컬 모드'; tag.className = 'net local'; return; }
  const off = state === 'off' || !navigator.onLine;
  tag.textContent = off ? '오프라인 (복구 시 자동 동기화)' : '실시간 연결됨';
  tag.className = off ? 'net off' : 'net';
}
window.addEventListener('online', () => setNetState('on'));
window.addEventListener('resize', () => { if (role === 'display') Display.render(); });
window.addEventListener('offline', () => setNetState('off'));
</script>
<script>
/* =====================================================================
   모달 · 토스트
   ===================================================================== */
function openModal(html) {
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal">${html}</div>`;
  $('#modalRoot').appendChild(back);
  return back;
}

// 확인 모달 → true / false
function confirmModal({ title, msg, okText = '확인', okClass = 'primary', cancelText = '취소' }) {
  return new Promise((resolve) => {
    const m = openModal(`
      <h2>${esc(title)}</h2>
      <div class="msg">${msg}</div>
      <div class="actions">
        <button class="btn ghost" data-r="0">${esc(cancelText)}</button>
        <button class="btn ${okClass}" data-r="1">${esc(okText)}</button>
      </div>`);
    m.querySelectorAll('[data-r]').forEach((b) => b.onclick = () => { m.remove(); resolve(b.dataset.r === '1'); });
  });
}

// 숫자 입력 모달 (키패드) → 숫자 / null
function numberModal(title, initial = 0, unit = '개') {
  return new Promise((resolve) => {
    let val = String(initial || '');
    const m = openModal(`
      <h2>${esc(title)}</h2>
      <div class="qty-display"><span id="nmVal"></span> ${esc(unit)}</div>
      <div class="keypad">
        ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button data-k="${n}">${n}</button>`).join('')}
        <button data-k="C">C</button><button data-k="0">0</button><button data-k="B">⌫</button>
      </div>
      <div class="actions">
        <button class="btn ghost" data-r="0">취소</button>
        <button class="btn primary" data-r="1">확인</button>
      </div>`);
    const show = () => { m.querySelector('#nmVal').textContent = Number(val || 0).toLocaleString('ko-KR'); };
    show();
    m.querySelectorAll('[data-k]').forEach((b) => b.onclick = () => {
      const k = b.dataset.k;
      if (k === 'C') val = '';
      else if (k === 'B') val = val.slice(0, -1);
      else if (val.length < 7) val = (val + k).replace(/^0+/, '');
      show();
    });
    m.querySelectorAll('[data-r]').forEach((b) => b.onclick = () => {
      m.remove();
      resolve(b.dataset.r === '1' ? Number(val || 0) : null);
    });
  });
}

let toastTimer = null;
function toast(text, { actionText, onAction, ms = 3000 } = {}) {
  clearTimeout(toastTimer);
  const root = $('#toastRoot');
  root.innerHTML = `<div class="toast"><span>${esc(text)}</span>${actionText ? `<button>${esc(actionText)}</button>` : ''}</div>`;
  if (actionText) root.querySelector('button').onclick = () => { root.innerHTML = ''; onAction(); };
  toastTimer = setTimeout(() => { root.innerHTML = ''; }, ms);
}

// DB 호출 공통 에러 처리
async function run(fn, okMsg) {
  try {
    const r = await fn();
    if (okMsg) toast(okMsg);
    return r;
  } catch (e) {
    console.error(e);
    await confirmModal({ title: '처리 실패', msg: esc(e.message || e), okText: '확인', cancelText: '닫기' });
    return undefined;
  }
}

/* =====================================================================
   역할(화면) 전환
   ===================================================================== */
let role = null;
try { role = localStorage.getItem(CONFIG.roleKey); } catch {}
if (!ROLES[role]) role = null;

const VIEWS = {};   // role → { render(), onData(name), leave() }

function setRole(r) {
  if (currentView()?.leave) currentView().leave();
  role = r;
  try { r ? localStorage.setItem(CONFIG.roleKey, r) : localStorage.removeItem(CONFIG.roleKey); } catch {}
  renderApp();
}
function changeRole() { setRole(null); }
function currentView() { return role ? VIEWS[role.startsWith('order') ? 'order' : role] : null; }

function renderApp() {
  document.body.classList.toggle('display-mode', role === 'display');
  $('#roleTag').textContent = role ? `${ROLES[role].icon} ${ROLES[role].label}` : '역할 선택';
  if (!role) {
    $('#app').innerHTML = `
      <div style="text-align:center;margin-top:24px">
        <h2 style="font-size:28px">이 기기의 역할을 선택하세요</h2>
        <div style="color:var(--muted)">선택값은 이 기기에 저장되어 새로고침해도 유지됩니다.</div>
      </div>
      <div class="role-grid">
        ${Object.entries(ROLES).map(([k, v]) => `
          <button onclick="setRole('${k}')"><span>${v.icon}</span>${v.label}<small>${v.desc}</small></button>`).join('')}
      </div>`;
    return;
  }
  currentView().render();
}

function onDataChange(name) {
  const v = currentView();
  if (v && v.onData) v.onData(name);
}

const allReady = () => S.ready.menus && S.ready.orders && S.ready.settings;
const loadingHtml = '<div class="empty">데이터 불러오는 중…</div>';

/* =====================================================================
   주문 진행 단계 공통 처리 (조리대·매니저 화면이 함께 사용)
   조리 중(waiting) → 수령 대기(ready) → 수령 완료(picked)  /  취소(cancelled)
   ===================================================================== */
const STATUS_TEXT = { waiting: '조리 중', ready: '수령 대기', picked: '수령 완료', cancelled: '취소됨' };
const dur = (ms) => {
  const s = Math.max(0, Math.floor(ms / 1000));
  return s >= 3600 ? `${Math.floor(s / 3600)}시간 ${Math.floor((s % 3600) / 60)}분` : `${Math.floor(s / 60)}분 ${pad2(s % 60)}초`;
};
const clockStr = (ms) => { const d = new Date(ms); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; };
const callAt = (o) => Math.max(o.readyAt || 0, o.recallAt || 0);   // 마지막으로 호출된 시각

// 동작별로 바꿀 필드와, 그 동작이 허용되는 현재 상태
const OrderOps = {
  ready:   (id) => DB.updateOrder(id, { status: 'ready', readyAt: Date.now(), pickedAt: null, recallAt: null }, ['waiting']),
  unready: (id) => DB.updateOrder(id, { status: 'waiting', readyAt: null, pickedAt: null, recallAt: null }, ['ready']),
  pick:    (id) => DB.updateOrder(id, { status: 'picked', pickedAt: Date.now() }, ['ready']),
  unpick:  (id) => DB.updateOrder(id, { status: 'ready', pickedAt: null }, ['picked']),
  recall:  (id) => DB.updateOrder(id, { recallAt: Date.now() }, ['ready']),
  memo:    (id, memo) => DB.updateOrder(id, { memo }),
};

// 버튼 동작 + 결과 안내 (준비 완료·수령 완료는 몇 초간 되돌리기 가능)
async function orderAction(kind, id) {
  const o = S.orders.find((x) => x.id === id);
  if (!o) return;
  const no = o.orderNo;
  try {
    await OrderOps[kind](id);
  } catch (e) {
    console.error(e);
    toast(`처리 실패: ${e.message}`, { ms: 5000 });
    return;
  }
  const text = {
    ready: `${no}번 준비 완료 → 호출했습니다`,
    unready: `${no}번을 조리 중으로 되돌렸습니다`,
    pick: `${no}번 수령 완료`,
    unpick: `${no}번을 수령 대기로 되돌렸습니다`,
    recall: `${no}번을 다시 호출했습니다`,
  }[kind];
  const undo = { ready: 'unready', pick: 'unpick' }[kind];
  toast(text, undo ? {
    actionText: '되돌리기',
    ms: CONFIG.undoSeconds * 1000,
    onAction: () => run(() => OrderOps[undo](id), `${no}번을 되돌렸습니다`),
  } : {});
}

// 주문 취소 (결제·매니저 화면 공용)
async function cancelOrderFlow(id) {
  const o = S.orders.find((x) => x.id === id);
  if (!o) return;
  const warn = {
    ready: '\n\n⚠️ 이미 조리가 끝난 주문입니다.',
    picked: '\n\n⚠️ 손님이 이미 받아 간 주문입니다.\n재고가 복구되므로, 라면을 먹었다면 보충·폐기 탭에서 폐기로 기록하세요.',
  }[o.status] || '';
  const ok = await confirmModal({
    title: `${o.orderNo}번 주문 취소`,
    msg: `${esc(itemsText(o.items))}\n${money(o.total)} 을(를) 환불하고 재고를 복구합니다.${warn}`,
    okText: '주문 취소', okClass: 'danger', cancelText: '닫기',
  });
  if (ok) await run(() => DB.cancelOrder(id), `${o.orderNo}번 주문이 취소되었습니다.`);
}

// 메모 입력 모달 → 문자열 / null(취소)
function memoModal(o) {
  return new Promise((resolve) => {
    const presets = ['덜 맵게', '계란 추가', '국물 적게', '포장', '환불 요청', '서비스 제공'];
    const m = openModal(`
      <h2>${o.orderNo}번 메모</h2>
      <textarea id="memoText" maxlength="100" rows="3"
        style="width:100%;font-size:20px;padding:10px;border:2px solid var(--line);border-radius:10px;resize:none">${esc(o.memo || '')}</textarea>
      <div class="quick" style="grid-template-columns:repeat(3,1fr)">
        ${presets.map((t) => `<button data-p="${esc(t)}">${esc(t)}</button>`).join('')}
      </div>
      <div style="color:var(--muted);font-size:14px">메모는 조리대와 매니저 화면에 보여요 (최대 100자)</div>
      <div class="actions">
        <button class="btn ghost" data-r="clear">지우기</button>
        <button class="btn ghost" data-r="0">취소</button>
        <button class="btn primary" data-r="1">저장</button>
      </div>`);
    const ta = m.querySelector('#memoText');
    m.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => {
      ta.value = (ta.value.trim() ? `${ta.value.trim()}, ${b.dataset.p}` : b.dataset.p).slice(0, 100);
    });
    m.querySelectorAll('[data-r]').forEach((b) => b.onclick = () => {
      if (b.dataset.r === 'clear') { ta.value = ''; ta.focus(); return; }
      m.remove();
      resolve(b.dataset.r === '1' ? ta.value.trim().slice(0, 100) : null);
    });
  });
}

/* =====================================================================
   결제 화면 (Order / Cashier)
   ===================================================================== */
const Cashier = {
  cart: {},        // menuId → 수량
  recv: '',        // 받은 돈 (문자열)
  press: null,     // 길게 누르기 상태
  busy: false,

  render() {
    if (!allReady()) { $('#app').innerHTML = loadingHtml; return; }
    this.cleanCart();
    const menus = S.menus.filter((m) => m.visible !== false);
    const items = this.cartItems();
    const total = items.reduce((s, i) => s + i.price * i.qty, 0);
    const recv = Number(this.recv || 0);
    const change = recv - total;
    const canPay = items.length > 0 && recv >= total && !this.busy;
    const quick = (S.settings.quickCash || CONFIG.defaults.quickCash);

    let changeHtml;
    if (!items.length) changeHtml = `<div class="change-box"><div class="label">메뉴를 선택하세요</div><div class="amt">-</div></div>`;
    else if (recv < total) changeHtml = `<div class="change-box short"><div class="label">받은 돈이 부족합니다</div><div class="amt">${money(total - recv)} 부족</div></div>`;
    else changeHtml = `<div class="change-box"><div class="label">거스름돈</div><div class="amt">${money(change)}</div></div>`;

    $('#app').innerHTML = `
      <div class="order-layout">
        <div>
          <div class="menu-grid">
            ${menus.length ? menus.map((m) => this.tileHtml(m)).join('') : '<div class="empty" style="grid-column:1/-1">등록된 메뉴가 없습니다.<br>설정·정산 화면에서 메뉴를 추가하세요.</div>'}
          </div>
          <div class="card" style="margin-top:16px">
            <h2>최근 주문</h2>
            ${this.recentHtml()}
          </div>
        </div>
        <div class="side">
         <div class="col">
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <h2 style="margin:0">장바구니</h2>
              <button class="btn small ghost" onclick="Cashier.clear()" ${items.length ? '' : 'disabled'}>전체 비우기</button>
            </div>
            <div class="cart-list">
              ${items.length ? items.map((i) => `
                <div class="cart-row">
                  <span class="n">${esc(i.name)}</span>
                  <span>×${i.qty}</span>
                  <span style="width:100px;text-align:right">${money(i.price * i.qty)}</span>
                  <button class="del" onclick="Cashier.remove('${i.menuId}')">✕</button>
                </div>`).join('') : '<div style="color:var(--muted);padding:12px 0">메뉴를 탭하면 추가됩니다. (길게 누르면 수량 입력)</div>'}
            </div>
            <div class="total-line"><span>총 결제 금액</span><span class="big">${money(total)}</span></div>
          </div>
          ${changeHtml}
          <button class="pay-btn" onclick="Cashier.pay()" ${canPay ? '' : 'disabled'}>${this.busy ? '처리 중…' : '결제 완료'}</button>
         </div>
         <div class="col">
          <div class="card">
            <div class="total-line" style="margin:0"><span>받은 돈</span><span class="received">${money(recv)}</span></div>
            <div class="quick">
              ${quick.map((q) => `<button onclick="Cashier.addRecv(${q})">+${Number(q).toLocaleString('ko-KR')}</button>`).join('')}
              <button onclick="Cashier.exact()" style="background:#e7f5ff;border-color:#a5d8ff">딱 맞게</button>
            </div>
            <div class="keypad">
              ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button onclick="Cashier.key('${n}')">${n}</button>`).join('')}
              <button onclick="Cashier.key('00')">00</button><button onclick="Cashier.key('0')">0</button><button onclick="Cashier.key('B')">⌫</button>
            </div>
            <button class="btn ghost small" style="width:100%;margin-top:8px" onclick="Cashier.key('C')">받은 돈 지우기</button>
          </div>
         </div>
        </div>
      </div>`;
  },

  onData() { this.render(); },

  tileHtml(m) {
    const q = this.cart[m.id] || 0;
    const stock = m.stockCurrent ?? 0;
    const soldout = stock <= 0;
    const low = !soldout && stock <= (m.threshold ?? CONFIG.defaults.threshold);
    return `
      <button class="tile ${soldout ? 'soldout' : ''}" ${soldout ? 'disabled' : ''}
        onpointerdown="Cashier.down(event,'${m.id}')" onpointerup="Cashier.up(event,'${m.id}')"
        onpointerleave="Cashier.cancelPress()" onpointercancel="Cashier.cancelPress()" oncontextmenu="return false">
        ${low ? `<span class="low-badge">재고 ${stock}</span>` : ''}
        ${q ? `<span class="qty-badge">${q}</span>` : ''}
        <span class="name">${esc(m.name)}</span>
        <span class="price">${money(m.price)}</span>
        <span class="stock">남은 수량 ${stock}</span>
      </button>`;
  },

  recentHtml() {
    const list = S.orders.slice(-CONFIG.recentOrderCount).reverse();
    if (!list.length) return '<div style="color:var(--muted)">아직 주문이 없습니다.</div>';
    const label = STATUS_TEXT;
    return list.map((o) => `
      <div class="recent-row">
        <span class="no">${o.orderNo}</span>
        <span class="desc">${esc(itemsText(o.items))}<br><small style="color:var(--muted)">${o.register ? `결제 ${o.register} · ` : ''}${timeStr(o.createdAt)} · ${money(o.total)}</small></span>
        <span class="status ${o.status}">${label[o.status]}</span>
        ${o.status !== 'cancelled' ? `<button class="btn small danger" onclick="Cashier.cancelOrder('${o.id}')">취소</button>` : ''}
      </div>`).join('');
  },

  // 삭제·숨김·매진된 메뉴는 장바구니에서 정리
  cleanCart() {
    for (const id of Object.keys(this.cart)) {
      const m = S.menus.find((x) => x.id === id);
      if (!m || m.visible === false || (m.stockCurrent ?? 0) <= 0) delete this.cart[id];
      else if (this.cart[id] > m.stockCurrent) this.cart[id] = m.stockCurrent;
    }
  },

  cartItems() {
    return Object.entries(this.cart)
      .map(([menuId, qty]) => {
        const m = S.menus.find((x) => x.id === menuId);
        return m ? { menuId, name: m.name, price: Number(m.price) || 0, qty } : null;
      })
      .filter((x) => x && x.qty > 0);
  },

  // ---- 메뉴 타일: 탭 = +1, 길게 누르기 = 수량 직접 입력 ----
  down(e, id) {
    this.cancelPress();
    this.press = { id, long: false, timer: setTimeout(() => { this.press.long = true; this.askQty(id); }, CONFIG.longPressMs) };
  },
  up(e, id) {
    if (!this.press || this.press.id !== id) return;
    clearTimeout(this.press.timer);
    const wasLong = this.press.long;
    this.press = null;
    if (!wasLong) this.setQty(id, (this.cart[id] || 0) + 1);
  },
  cancelPress() {
    if (this.press) { clearTimeout(this.press.timer); if (!this.press.long) this.press = null; }
  },
  async askQty(id) {
    const m = S.menus.find((x) => x.id === id);
    this.press = null;
    if (!m) return;
    const n = await numberModal(`${m.name} 수량 입력 (최대 ${m.stockCurrent})`, this.cart[id] || 0);
    if (n !== null) this.setQty(id, n);
  },
  setQty(id, qty) {
    const m = S.menus.find((x) => x.id === id);
    if (!m) return;
    if (qty > m.stockCurrent) { toast(`${m.name}: 남은 수량이 ${m.stockCurrent}개입니다.`); qty = m.stockCurrent; }
    if (qty <= 0) delete this.cart[id]; else this.cart[id] = qty;
    this.render();
  },
  remove(id) { delete this.cart[id]; this.render(); },
  clear() { this.cart = {}; this.recv = ''; this.render(); },

  // ---- 받은 돈 입력 ----
  key(k) {
    if (k === 'C') this.recv = '';
    else if (k === 'B') this.recv = this.recv.slice(0, -1);
    else if (this.recv.length < 8) this.recv = (this.recv + k).replace(/^0+/, '');
    this.render();
  },
  addRecv(n) { this.recv = String(Number(this.recv || 0) + Number(n)); this.render(); },
  exact() {
    const total = this.cartItems().reduce((s, i) => s + i.price * i.qty, 0);
    this.recv = total ? String(total) : '';
    this.render();
  },

  // ---- 결제 확정 ----
  async pay() {
    const items = this.cartItems();
    const total = items.reduce((s, i) => s + i.price * i.qty, 0);
    const recv = Number(this.recv || 0);
    if (!items.length || recv < total || this.busy) return;
    const ok = await confirmModal({
      title: '결제를 완료할까요?',
      msg: `${esc(itemsText(items))}\n\n총액 <b>${money(total)}</b>\n받은 돈 <b>${money(recv)}</b>\n거스름돈 <b style="color:var(--ok);font-size:26px">${money(recv - total)}</b>`,
      okText: '결제 완료', okClass: 'ok',
    });
    if (!ok) return;
    this.busy = true; this.render();
    const register = Number(role.slice(5));
    const no = await run(() => DB.createOrder(items, recv, register));
    this.busy = false;
    if (no === undefined) { this.render(); return; }
    this.cart = {}; this.recv = '';
    this.render();
    const m = openModal(`
      <h2 style="text-align:center">주문번호</h2>
      <div class="done-no">${no}</div>
      <div style="text-align:center;font-size:20px">식권에 <b>${no}번</b>을 적어 전달하세요</div>
      ${(no - 1) % CONFIG.orderBlockSize === CONFIG.orderBlockSize - 1 ? `
        <div style="text-align:center;margin-top:10px;padding:10px;border-radius:12px;background:#fff3bf;font-size:18px;font-weight:700">
          📢 이 계산대의 ${no - CONFIG.orderBlockSize + 1}~${no}번을 다 썼어요!<br>다음 손님은 <b>${no + (CONFIG.cashierCount - 1) * CONFIG.orderBlockSize + 1}번</b>부터예요.</div>` : ''}
      <div class="change-box" style="margin-top:16px"><div class="label">거스름돈</div><div class="amt">${money(recv - total)}</div></div>
      <div class="actions"><button class="btn primary">다음 손님</button></div>`);
    m.querySelector('button').onclick = () => m.remove();
  },

  cancelOrder(id) { return cancelOrderFlow(id); },
};
VIEWS.order = Cashier;

/* =====================================================================
   조리대 화면 (Kitchen)
   ===================================================================== */
const Kitchen = {
  timer: null,

  render() {

    // 메뉴별 조리 필요 수량 합계
    const need = {};

    const memo = (o) => (o.memo ? `<div class="memo">📝 ${esc(o.memo)}</div>` : '');

    $('#app').innerHTML = `
      <div class="summary-bar">
        <span class="chip">🔥 조리 중 <b>${waiting.length}</b>건</span>
        ${Object.entries(need).map(([n, q]) => `<span class="chip">${esc(n)} <b>${q}</b></span>`).join('')}
        <span class="chip">🔔 수령 대기 <b>${pickup.length}</b>건</span>
      </div>
      ${waiting.length ? `<div class="kitchen-grid">${waiting.map((o) => `
        <div class="k-card" data-since="${o.createdAt}" data-kind="cook">
          <div class="head"><span class="no">${o.orderNo}</span><span class="elapsed"></span></div>
          ${items(o)}${memo(o)}
          <button class="ready-btn" onclick="orderAction('ready','${o.id}')">준비 완료</button>
        </div>`).join('')}</div>` : '<div class="empty">🍜 조리할 주문이 없습니다</div>'}
      <h2 class="k-section">🔔 수령 대기 <small>식권을 받고 라면을 건넨 뒤 [수령 완료]를 누르세요</small></h2>
      ${pickup.length ? `<div class="kitchen-grid">${pickup.map((o) => `
        <div class="k-card pickup" data-since="${o.readyAt}" data-kind="pickup">
          <div class="head"><span class="no">${o.orderNo}</span><span class="elapsed"></span></div>
          ${items(o)}${memo(o)}
          <button class="ready-btn pick" onclick="orderAction('pick','${o.id}')">수령 완료</button>
        </div>`).join('')}</div>` : '<div class="empty small">수령 대기 중인 주문이 없습니다</div>'}`;
    this.tick();
    if (!this.timer) this.timer = setInterval(() => this.tick(), 1000);
  },

  // 경과 시간만 갱신 (버튼 터치 중 화면이 다시 그려지지 않도록)
  tick() {
    const lateMs = {
      cook: (S.settings.lateMinutes ?? CONFIG.defaults.lateMinutes) * 60000,
      pickup: (S.settings.pickupLateMinutes ?? CONFIG.defaults.pickupLateMinutes) * 60000,
    };
    document.querySelectorAll('.k-card').forEach((c) => {
      const ms = Date.now() - Number(c.dataset.since);
      c.querySelector('.elapsed').textContent = `⏱ ${dur(ms)}`;
      c.classList.toggle('late', ms >= lateMs[c.dataset.kind]);
    });
  },

  onData(name) { if (name !== 'adjustments') this.render(); },
  leave() { clearInterval(this.timer); this.timer = null; },
};
VIEWS.kitchen = Kitchen;

/* =====================================================================
   매니저 화면 (Manager) — 결제부터 수령까지 전체 흐름을 한눈에 보고 관리
   ===================================================================== */
const STAGES = [
  { key: 'waiting', icon: '🔥', label: '조리 중' },
  { key: 'ready', icon: '🔔', label: '수령 대기' },
  { key: 'picked', icon: '✅', label: '수령 완료' },
];

const Manager = {
  tab: 'board',        // board(보드) | table(주문 표)
  col: 'waiting',      // 좁은 화면(스마트폰)에서 보고 있는 칸
  q: '',               // 주문 표 검색어
  filter: 'all',       // 주문 표 상태 필터
  reg: 0,              // 주문 표 계산대 필터 (0 = 전체)
  detailId: null,
  detailEl: null,
  timer: null,
  PICKED_LIMIT: 30,    // 보드의 수령 완료 칸에 보여 줄 최근 건수

  render() {
    if (!allReady()) { $('#app').innerHTML = loadingHtml; return; }
    const seg = (items, cur, fn) => `<div class="seg">${items.map(([k, l]) =>
      `<button class="${cur === k ? 'on' : ''}" onclick="${fn}('${k}')">${l}</button>`).join('')}</div>`;
    const controls = this.tab === 'table'
      ? `<div class="mgr-controls">
          <input id="mgrSearch" type="search" placeholder="🔍 주문번호 또는 메뉴 이름" value="${esc(this.q)}"
            oninput="Manager.q=this.value;Manager.renderContent()">
          ${seg([['all', '전체'], ...STAGES.map((st) => [st.key, st.label]), ['cancelled', '취소']], this.filter, 'Manager.setFilter')}
          ${seg([['0', '모든 계산대'], ...Array.from({ length: CONFIG.cashierCount }, (_, i) => [String(i + 1), `결제 ${i + 1}`])], String(this.reg), 'Manager.setReg')}
        </div>`
      : `<div class="mgr-colpick">${seg(STAGES.map((st) => [st.key, `${st.icon} ${st.label}`]), this.col, 'Manager.setCol')}</div>`;
    $('#app').innerHTML = `
      <div id="mgrTop"></div>
      <div class="tabs">
        <button class="${this.tab === 'board' ? 'on' : ''}" onclick="Manager.go('board')">🗂 보드</button>
        <button class="${this.tab === 'table' ? 'on' : ''}" onclick="Manager.go('table')">📋 주문 표</button>
      </div>
      ${controls}
      <div id="mgrContent"></div>`;
    this.renderTop();
    this.renderContent();
    if (!this.timer) this.timer = setInterval(() => this.tick(), 1000);
  },

  go(tab) { this.tab = tab; this.render(); },
  setFilter(k) { this.filter = k; this.render(); },
  setReg(k) { this.reg = Number(k); this.render(); },
  setCol(k) { this.col = k; this.render(); },

  onData(name) {
    if (name === 'adjustments') return;
    this.renderTop();
    this.renderContent();
    if (this.detailEl) this.renderDetail();
  },

  leave() {
    clearInterval(this.timer);
    this.timer = null;
    this.close();
  },

  // 조리 지연 / 미수령 여부
  isLate(o, now = Date.now()) {
    if (o.status === 'waiting') return now - o.createdAt >= (S.settings.lateMinutes ?? CONFIG.defaults.lateMinutes) * 60000;
    if (o.status === 'ready') return now - (o.readyAt || now) >= (S.settings.pickupLateMinutes ?? CONFIG.defaults.pickupLateMinutes) * 60000;
    return false;
  },

  // 상단: 단계별 건수 + 경고
  renderTop() {
    const el = $('#mgrTop');
    if (!el) return;
    const count = (st) => S.orders.filter((o) => o.status === st).length;
    const lateCook = S.orders.filter((o) => o.status === 'waiting' && this.isLate(o));
    const latePick = S.orders.filter((o) => o.status === 'ready' && this.isLate(o));
    const shown = S.menus.filter((m) => m.visible !== false);
    const soldout = shown.filter((m) => (m.stockCurrent ?? 0) <= 0);
    const low = shown.filter((m) => (m.stockCurrent ?? 0) > 0 && m.stockCurrent <= (m.threshold ?? CONFIG.defaults.threshold));
    const nums = (list) => list.map((o) => `${o.orderNo}번`).join(', ');
    const alerts = [
      lateCook.length && `<span class="alert red">⏰ 조리 지연 ${lateCook.length}건 · ${nums(lateCook)}</span>`,
      latePick.length && `<span class="alert amber">🍜 미수령 ${latePick.length}건 · ${nums(latePick)}</span>`,
      ...soldout.map((m) => `<span class="alert gray">🚫 ${esc(m.name)} 매진</span>`),
      ...low.map((m) => `<span class="alert amber">📦 ${esc(m.name)} ${m.stockCurrent}개 남음</span>`),
    ].filter(Boolean);
    el.innerHTML = `
      <div class="mgr-summary">
        ${[...STAGES, { key: 'cancelled', icon: '❌', label: '취소' }].map((st) =>
          `<div class="mgr-count ${st.key}"><span>${st.icon} ${st.label}</span><b>${count(st.key)}</b></div>`).join('')}
      </div>
      <div class="mgr-alerts">${alerts.length ? alerts.join('') : '<span class="alert ok">👍 지연·미수령·재고 문제 없음</span>'}</div>`;
  },

  renderContent() {
    const el = $('#mgrContent');
    if (!el) return;
    el.innerHTML = this.tab === 'board' ? this.boardHtml() : this.tableHtml();
    this.tick(false);
  },

  // 1초마다: 경과 시간 글자 + 지연 강조 + 상단 경고 갱신
  tick(withTop = true) {
    const now = Date.now();
    document.querySelectorAll('#mgrContent [data-since], #modalRoot [data-since]').forEach((e) => {
      e.textContent = `${e.dataset.prefix || ''}${dur(now - Number(e.dataset.since))}`;
    });
    document.querySelectorAll('#mgrContent [data-order]').forEach((e) => {
      const o = S.orders.find((x) => x.id === e.dataset.order);
      if (o) e.classList.toggle('late', this.isLate(o, now));
    });
    if (withTop) this.renderTop();
  },

  timeHtml(o) {
    if (o.status === 'waiting') return `<span class="m-time" data-since="${o.createdAt}" data-prefix="⏱ "></span>`;
    if (o.status === 'ready') return `<span class="m-time" data-since="${o.readyAt}" data-prefix="🔔 "></span>`;
    if (o.status === 'picked') return `<span class="m-time">수령 ${timeStr(o.pickedAt)}</span>`;
    return `<span class="m-time">취소 ${timeStr(o.cancelledAt)}</span>`;
  },

  /* ---------------- 보드 ---------------- */
  boardHtml() {
    const lists = {
      waiting: S.orders.filter((o) => o.status === 'waiting'),
      ready: S.orders.filter((o) => o.status === 'ready').sort((a, b) => a.readyAt - b.readyAt),
      picked: S.orders.filter((o) => o.status === 'picked').sort((a, b) => b.pickedAt - a.pickedAt),
    };
    return `<div class="mgr-board" data-col="${this.col}">${STAGES.map((st) => {
      const all = lists[st.key];
      const shown = st.key === 'picked' ? all.slice(0, this.PICKED_LIMIT) : all;
      return `<section class="mgr-col ${st.key}">
        <h3><span>${st.icon} ${st.label}</span><b>${all.length}</b></h3>
        ${shown.length ? shown.map((o) => this.cardHtml(o)).join('') : '<div class="none">없음</div>'}
        ${all.length > shown.length ? `<div class="none">최근 ${this.PICKED_LIMIT}건만 표시 · 전체는 📋 주문 표에서</div>` : ''}
      </section>`;
    }).join('')}</div>`;
  },

  cardHtml(o) {
    const stop = 'event.stopPropagation();';
    const actions = o.status === 'waiting'
      ? `<button class="btn ok" onclick="${stop}orderAction('ready','${o.id}')">🔔 준비 완료</button>`
      : o.status === 'ready'
        ? `<button class="btn blue" onclick="${stop}orderAction('pick','${o.id}')">✅ 수령 완료</button>
           <button class="btn" onclick="${stop}orderAction('recall','${o.id}')">📢 다시 호출</button>`
        : '';
    return `
      <div class="m-card ${this.isLate(o) ? 'late' : ''}" data-order="${o.id}" onclick="Manager.open('${o.id}')">
        <div class="m-head"><span class="m-no">${o.orderNo}</span>${o.register ? `<span class="m-reg">결제 ${o.register}</span>` : ''}${this.timeHtml(o)}</div>
        <div class="m-items">${o.items.map((i) => `${esc(i.name)} ×${i.qty}`).join('<br>')}</div>
        ${o.memo ? `<div class="memo">📝 ${esc(o.memo)}</div>` : ''}
        ${actions ? `<div class="m-actions">${actions}</div>` : ''}
      </div>`;
  },

  /* ---------------- 주문 표 ---------------- */
  tableHtml() {
    const q = this.q.trim();
    const list = S.orders
      .filter((o) => this.filter === 'all' || o.status === this.filter)
      .filter((o) => !this.reg || o.register === this.reg)
      .filter((o) => !q || String(o.orderNo).includes(q) || o.items.some((i) => i.name.includes(q)))
      .slice().reverse();
    if (!list.length) return '<div class="empty">조건에 맞는 주문이 없습니다</div>';
    return `
      <div style="color:var(--muted);margin-bottom:6px">${list.length}건 · 줄을 누르면 자세히 볼 수 있어요</div>
      <div class="card scroll-x" style="padding:0">
        <table class="mgr-table">
          <thead><tr><th>번호</th><th class="hide-sm">계산대</th><th>메뉴</th><th class="num">금액</th><th>상태</th><th class="hide-sm">결제</th><th>경과</th></tr></thead>
          <tbody>${list.map((o) => `
            <tr class="${this.isLate(o) ? 'late' : ''}" data-order="${o.id}" onclick="Manager.open('${o.id}')">
              <td style="font-size:22px;font-weight:900">${o.orderNo}</td>
              <td class="hide-sm">${o.register ? `결제 ${o.register}` : ''}</td>
              <td>${esc(itemsText(o.items))}${o.memo ? `<div class="memo">📝 ${esc(o.memo)}</div>` : ''}</td>
              <td class="num">${money(o.total)}</td>
              <td><span class="status ${o.status}">${STATUS_TEXT[o.status]}</span></td>
              <td class="hide-sm">${timeStr(o.createdAt)}</td>
              <td>${o.status === 'waiting' || o.status === 'ready' ? this.timeHtml(o)
                : o.status === 'picked' ? `<span class="m-time">${dur(o.pickedAt - o.createdAt)} 걸림</span>` : '-'}</td>
            </tr>`).join('')}</tbody>
        </table>
      </div>`;
  },

  /* ---------------- 주문 상세 ---------------- */
  open(id) {
    this.close();
    this.detailId = id;
    this.detailEl = openModal('');
    this.detailEl.querySelector('.modal').classList.add('wide');
    this.detailEl.addEventListener('click', (e) => { if (e.target === this.detailEl) this.close(); });
    this.renderDetail();
  },

  close() {
    if (this.detailEl) this.detailEl.remove();
    this.detailEl = null;
    this.detailId = null;
  },

  renderDetail() {
    const o = S.orders.find((x) => x.id === this.detailId);
    if (!o) { this.close(); return; }
    const id = o.id;
    const step = (label, at, note) => `<li><span>${label}</span><b>${clockStr(at)}</b>${note ? `<small>${note}</small>` : ''}</li>`;
    const live = (label, since) => `<li><span>${label}</span><b data-since="${since}" data-prefix="⏱ "></b></li>`;
    const timeline = [
      step(`💰 결제${o.register ? ` (결제 ${o.register})` : ''}`, o.createdAt),
      o.readyAt ? step('🔔 조리 완료 · 호출', o.readyAt, `결제 후 ${dur(o.readyAt - o.createdAt)}`)
        : o.status === 'waiting' ? live('🔥 조리 중…', o.createdAt) : '',
      o.recallAt ? step('📢 다시 호출', o.recallAt) : '',
      o.pickedAt ? step('✅ 수령 완료', o.pickedAt, o.readyAt ? `호출 후 ${dur(o.pickedAt - o.readyAt)}` : '')
        : o.status === 'ready' ? live('🍜 수령 기다리는 중…', o.readyAt) : '',
      o.cancelledAt ? step('❌ 주문 취소', o.cancelledAt) : '',
    ].join('');

    const A = (cls, label, js) => `<button class="btn ${cls}" onclick="${js}">${label}</button>`;
    const actions = {
      waiting: [A('ok', '🔔 준비 완료 (호출)', `orderAction('ready','${id}')`)],
      ready: [
        A('blue', '✅ 수령 완료', `orderAction('pick','${id}')`),
        A('', '📢 다시 호출', `orderAction('recall','${id}')`),
        A('ghost', '↩ 조리 중으로 되돌리기', `orderAction('unready','${id}')`),
      ],
      picked: [A('ghost', '↩ 수령 대기로 되돌리기', `orderAction('unpick','${id}')`)],
      cancelled: [],
    }[o.status] || [];
    if (o.status !== 'cancelled') actions.push(A('danger', '❌ 주문 취소', `cancelOrderFlow('${id}')`));

    this.detailEl.querySelector('.modal').innerHTML = `
      <div class="d-head"><span class="d-no">${o.orderNo}번</span><span class="status ${o.status}">${STATUS_TEXT[o.status]}</span></div>
      <table>
        <thead><tr><th>메뉴</th><th class="num">단가</th><th class="num">수량</th><th class="num">금액</th></tr></thead>
        <tbody>${o.items.map((i) => `<tr><td><b>${esc(i.name)}</b></td><td class="num">${money(i.price)}</td>
          <td class="num">${i.qty}</td><td class="num">${money(i.price * i.qty)}</td></tr>`).join('')}</tbody>
        <tfoot><tr><th colspan="3">합계</th><th class="num">${money(o.total)}</th></tr></tfoot>
      </table>
      <div style="color:var(--muted);margin-top:6px;text-align:right">받은 돈 ${money(o.received)} · 거스름돈 ${money(o.change)}</div>
      <h3>진행 기록</h3>
      <ul class="timeline">${timeline}</ul>
      <h3>메모</h3>
      <div class="row" style="align-items:center">
        <div class="memo" style="flex:1;margin:0;min-width:160px">${o.memo ? `📝 ${esc(o.memo)}` : '<span style="color:var(--muted);font-weight:400">메모 없음</span>'}</div>
        <button class="btn small" onclick="Manager.editMemo('${id}')">✏️ 메모 쓰기</button>
      </div>
      ${actions.length ? `<div class="d-actions">${actions.join('')}</div>` : '<div class="alert gray" style="margin-top:14px">취소된 주문입니다</div>'}
      <div class="actions"><button class="btn ghost" onclick="Manager.close()">닫기</button></div>`;
    this.tick(false);
  },

  async editMemo(id) {
    const o = S.orders.find((x) => x.id === id);
    if (!o) return;
    const memo = await memoModal(o);
    if (memo === null) return;
    await run(() => OrderOps.memo(id, memo), memo ? `${o.orderNo}번 메모를 저장했습니다` : `${o.orderNo}번 메모를 지웠습니다`);
  },
};
VIEWS.manager = Manager;
</script>
<script>
/* =====================================================================
   호출 연출: 기내 안내방송 스타일 차임음 + 음성합성
   ===================================================================== */
const Sound = {
  ctx: null,
  koVoice: null,

  unlock() {
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      this.ctx.resume();
    } catch (e) { console.warn('오디오 사용 불가', e); }
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      speechSynthesis.speak(u);
      this.pickVoice();
      speechSynthesis.onvoiceschanged = () => this.pickVoice();
    }
  },

  pickVoice() {
    const voices = speechSynthesis.getVoices();
    this.koVoice = voices.find((v) => v.lang === 'ko-KR' && /google/i.test(v.name))
      || voices.find((v) => v.lang && v.lang.toLowerCase().startsWith('ko')) || null;
  },

  // "딩-동" 두 음 (배음을 섞어 부드러운 종소리 느낌)
  chime() {
    return new Promise((resolve) => {
      if (!this.ctx) { resolve(); return; }
      const t0 = this.ctx.currentTime + 0.05;
      const tone = (freq, start, dur) => {
        [[1, 0.5], [2, 0.12], [3, 0.05]].forEach(([mult, gainVal]) => {
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = 'sine';
          o.frequency.value = freq * mult;
          g.gain.setValueAtTime(0.0001, start);
          g.gain.exponentialRampToValueAtTime(gainVal * (S.settings.ttsVolume ?? 1) + 0.0001, start + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
          o.connect(g).connect(this.ctx.destination);
          o.start(start);
          o.stop(start + dur + 0.05);
        });
      };
      tone(659.25, t0, 1.4);        // E5 (딩)
      tone(523.25, t0 + 0.7, 1.8);  // C5 (동)
      setTimeout(resolve, 2300);
    });
  },

  speak(text) {
    return new Promise((resolve) => {
      if (!('speechSynthesis' in window)) { resolve(); return; }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      if (this.koVoice) u.voice = this.koVoice;
      u.rate = Number(S.settings.ttsRate ?? 1);
      u.volume = Number(S.settings.ttsVolume ?? 1);
      let done = false;
      const finish = () => { if (!done) { done = true; resolve(); } };
      u.onend = finish; u.onerror = finish;
      setTimeout(finish, 8000);   // 일부 브라우저에서 onend 가 오지 않는 경우 대비
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    });
  },

  async announce(no) {
    if (S.settings.chime !== false) await this.chime();
    await this.speak(`${no}번 손님, 라면이 준비되었습니다.`);
  },
};

/* =====================================================================
   호출 화면 (Display) — 손님용, 조작 없음
   ===================================================================== */
const Display = {
  started: false,
  seen: null,        // 이미 호출한 "주문id@준비시각@다시호출시각" 집합
  queue: [],
  playing: false,
  flashNo: null,

  render() {
    // 이미 데이터가 있는 상태로 화면에 들어온 경우, 기존 호출은 방송하지 않도록 기준점 설정
    if (this.seen === null && S.ready.orders) this.seen = new Set(this.readyKeys().keys);
    const ready = S.orders.filter((o) => o.status === 'ready').sort((a, b) => callAt(b) - callAt(a));
    // 호출 중인 번호가 있으면 그 번호를 가운데에 표시
    const cur = this.flashNo ?? ready[0]?.orderNo;
    // 조리 중: 먼저 결제한 순서 / 조리 완료: 최근에 완료된 순서
    const cooking = S.orders.filter((o) => o.status === 'waiting').map((o) => o.orderNo);
    const done = ready.map((o) => o.orderNo);
    const chips = (list, isDone) => list.length
      ? `<div class="chips">${list.map((n) => `<span class="chip ${isDone && n === cur ? 'now' : ''}">${n}</span>`).join('')}</div>`
      : `<div class="none">${isDone ? '아직 완료된 주문이 없어요' : '조리 중인 주문이 없어요'}</div>`;
    $('#app').innerHTML = `
      <div class="display">
        <div class="title">🍜 ${esc(CONFIG.storeName)} 🍜</div>
        <div class="label">${cur != null ? '호출 번호' : ''}</div>
        <div class="current ${this.flashNo != null ? 'flash' : ''}" id="dispCur">${cur != null ? cur : '🍜'}</div>
        <div class="msg">${cur != null ? `${cur}번 손님, 라면이 준비되었습니다!` : '주문하신 라면을 맛있게 끓이고 있어요'}</div>
        <div class="boards">
          <div class="board cooking"><h3>🔥 조리 중 <small>${cooking.length}건 · 주문 순서</small></h3>${chips(cooking, false)}</div>
          <div class="board done"><h3>✅ 조리 완료 <small>식권을 가지고 받아 가세요</small></h3>${chips(done, true)}</div>
        </div>
        <div class="foot">Made by 정우쌤</div>
      </div>
      ${this.started ? '' : `
        <div class="start-overlay" onclick="Display.start()">
          📢 화면을 터치하여 호출 화면 시작
          <small>소리 재생 허용과 전체화면 전환을 위해 한 번 터치가 필요합니다</small>
        </div>`}
      <button class="display-exit" ondblclick="Display.exit()">나가기(더블클릭)</button>`;
    this.fitBoards();
  },

  // 현황판에 번호가 넘치면 뒤쪽 번호를 숨기고 "외 N건"으로 표시 (화면 크기에 맞춰 자동 계산)
  fitBoards() {
    document.querySelectorAll('.display .board').forEach((board) => {
      const box = board.querySelector('.chips');
      if (!box) return;
      const fits = () => board.scrollHeight <= board.clientHeight + 1;
      if (fits()) return;
      const chips = [...box.querySelectorAll('.chip')];
      const more = document.createElement('span');
      more.className = 'chip more';
      box.appendChild(more);
      let hidden = 0;
      do {
        chips.pop().remove();
        hidden++;
        more.textContent = `외 ${hidden}건`;
      } while (!fits() && chips.length);
    });
  },

  start() {
    Sound.unlock();
    this.started = true;
    try { document.documentElement.requestFullscreen?.(); } catch {}
    this.render();
  },

  exit() {
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch {}
    changeRole();
  },

  readyKeys() {
    // 조리 완료 또는 "다시 호출" 시각이 바뀌면 새 호출로 본다.
    // 수령 완료 주문도 기준점에 포함 → "수령 대기로 되돌리기"를 해도 다시 방송하지 않음
    const ready = S.orders.filter((o) => (o.status === 'ready' || o.status === 'picked') && o.readyAt)
      .sort((a, b) => callAt(a) - callAt(b));
    return { ready, keys: ready.map((o) => `${o.id}@${o.readyAt}@${o.recallAt || 0}`) };
  },

  onData(name) {
    if (name !== 'orders' && name !== 'settings') return;
    const { ready, keys } = this.readyKeys();
    if (this.seen === null) {
      // 첫 로딩 때는 기존 호출을 다시 방송하지 않는다
      if (S.ready.orders) this.seen = new Set(keys);
    } else {
      ready.forEach((o, i) => {
        if (!this.seen.has(keys[i])) {
          this.seen.add(keys[i]);
          if (o.status === 'ready') this.queue.push(o.orderNo);
        }
      });
      this.playQueue();
    }
    if (this.flashNo == null) this.render();
  },

  async playQueue() {
    if (this.playing) return;
    this.playing = true;
    while (this.queue.length) {
      const no = this.queue.shift();
      this.flashNo = no;
      this.render();
      if (this.started) await Sound.announce(no);
      else await new Promise((r) => setTimeout(r, 3000));
      await new Promise((r) => setTimeout(r, 600));
    }
    this.flashNo = null;
    this.playing = false;
    this.render();
  },

  leave() {
    this.queue = []; this.flashNo = null; this.seen = null;
    try { speechSynthesis.cancel(); } catch {}
  },
};
VIEWS.display = Display;

/* =====================================================================
   정산 계산
   ===================================================================== */
function computeReport(bucketMin = 30) {
  const valid = S.orders.filter((o) => o.status !== 'cancelled');
  const cancelled = S.orders.filter((o) => o.status === 'cancelled');
  const totalSales = valid.reduce((s, o) => s + o.total, 0);

  // 메뉴별 판매
  const byMenu = {};
  valid.forEach((o) => o.items.forEach((i) => {
    const r = byMenu[i.menuId] || (byMenu[i.menuId] = { menuId: i.menuId, name: i.name, qty: 0, amount: 0 });
    r.qty += i.qty; r.amount += i.qty * i.price;
  }));
  const menuSales = Object.values(byMenu).sort((a, b) => b.amount - a.amount);

  // 계산대별 매출 (돈통 정산용)
  const byRegister = Array.from({ length: CONFIG.cashierCount }, (_, i) => {
    const list = valid.filter((o) => o.register === i + 1);
    return { register: i + 1, count: list.length, amount: list.reduce((s, o) => s + o.total, 0) };
  });

  // 시간대별 매출
  const buckets = [];
  if (valid.length) {
    const size = bucketMin * 60000;
    const floor = (ms) => { const d = new Date(ms); d.setSeconds(0, 0); d.setMinutes(Math.floor(d.getMinutes() / bucketMin) * bucketMin); return d.getTime(); };
    const start = floor(Math.min(...valid.map((o) => o.createdAt)));
    const end = floor(Math.max(...valid.map((o) => o.createdAt)));
    for (let t = start; t <= end; t += size) buckets.push({ t, amount: 0, count: 0 });
    valid.forEach((o) => {
      const b = buckets[Math.floor((floor(o.createdAt) - start) / size)];
      if (b) { b.amount += o.total; b.count += 1; }
    });
  }

  // 재고 대사표
  const recon = S.menus.map((m) => {
    const adj = S.adjustments.filter((a) => a.menuId === m.id);
    const sum = (type) => adj.filter((a) => a.type === type).reduce((s, a) => s + a.qty, 0);
    const restock = sum('restock');
    const waste = sum('waste') + sum('gift');
    const sold = byMenu[m.id]?.qty || 0;
    const theory = (m.stockInitial ?? 0) + restock - sold - waste;
    return { name: m.name, initial: m.stockInitial ?? 0, restock, sold, waste, theory, current: m.stockCurrent ?? 0 };
  });

  return { valid, cancelled, totalSales, count: valid.length, avg: valid.length ? Math.round(totalSales / valid.length) : 0, menuSales, byRegister, buckets, recon };
}

/* =====================================================================
   CSV 내보내기 (엑셀 한글 깨짐 방지를 위해 BOM 추가)
   ===================================================================== */
function csvCell(v) { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
function downloadCsv(filename, rows) {
  const text = '﻿' + rows.map((r) => r.map(csvCell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const typeLabel = { restock: '보충', waste: '폐기', gift: '증정' };
const statusLabel = { waiting: '조리중', ready: '수령대기', picked: '수령완료', cancelled: '취소' };
const menuName = (id) => S.menus.find((m) => m.id === id)?.name || '(삭제된 메뉴)';

function exportSummaryCsv(bucketMin) {
  const R = computeReport(bucketMin);
  const rows = [
    ['[요약]'], ['총 매출', R.totalSales], ['주문 건수', R.count], ['평균 객단가', R.avg], ['취소 건수', R.cancelled.length], [],
    ['[계산대별 매출]'], ['계산대', '주문 건수', '매출'], ...R.byRegister.map((r) => [`결제 ${r.register}`, r.count, r.amount]), [],
    ['[메뉴별 판매]'], ['메뉴', '판매 수량', '매출'], ...R.menuSales.map((m) => [m.name, m.qty, m.amount]), [],
    [`[시간대별 매출 (${bucketMin}분 단위)]`], ['시작 시각', '주문 건수', '매출'], ...R.buckets.map((b) => [timeStr(b.t), b.count, b.amount]), [],
    ['[재고 대사표]'], ['메뉴', '초기 수량', '보충', '판매', '폐기·증정', '이론상 잔여', '현재 재고'],
    ...R.recon.map((r) => [r.name, r.initial, r.restock, r.sold, r.waste, r.theory, r.current]), [],
    ['[재고 조정 이력]'], ['시각', '메뉴', '구분', '수량', '메모'],
    ...S.adjustments.map((a) => [dateTimeStr(a.createdAt), menuName(a.menuId), typeLabel[a.type], a.qty, a.memo]), [],
    ['[취소 내역]'], ['주문번호', '주문 시각', '취소 시각', '메뉴', '금액'],
    ...R.cancelled.map((o) => [o.orderNo, dateTimeStr(o.createdAt), dateTimeStr(o.cancelledAt), itemsText(o.items), o.total]),
  ];
  downloadCsv(`라면가게_정산요약_${todayStr()}.csv`, rows);
}

function exportOrdersCsv() {
  const rows = [['주문번호', '계산대', '주문 시각', '상태', '메뉴', '단가', '수량', '소계', '주문 총액', '받은 돈', '거스름돈', '준비 완료 시각', '수령 완료 시각', '취소 시각', '메모']];
  S.orders.forEach((o) => o.items.forEach((i) => rows.push([
    o.orderNo, o.register ? `결제 ${o.register}` : '', dateTimeStr(o.createdAt), statusLabel[o.status], i.name, i.price, i.qty, i.price * i.qty,
    o.total, o.received, o.change, dateTimeStr(o.readyAt), dateTimeStr(o.pickedAt), dateTimeStr(o.cancelledAt), o.memo || '',
  ])));
  downloadCsv(`라면가게_주문상세_${todayStr()}.csv`, rows);
}

    const q = $('#adjQty'); if (q) q.value = '';
    const mm = $('#adjMemo'); if (mm) mm.value = '';

  /* ---------------- 정산 탭 ---------------- */
  reportHtml() {
